<!DOCTYPE html>
<html>
<head>
  <title>Tom-Select Test</title>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <h1>Tom-Select Multi-Select Test</h1>

  <div class="mb-3">
    <label for="test-select" class="form-label">Select Tags (Multiple)</label>
    <select id="test-select" multiple class="form-select">
      <option value="1">Ruby</option>
      <option value="2">Rails</option>
      <option value="3">JavaScript</option>
      <option value="4">HTML</option>
      <option value="5">CSS</option>
      <option value="6">Bootstrap</option>
    </select>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script>
    new TomSelect('#test-select', {
      plugins: ['remove_button'],
      maxItems: null,
      create: false,
      placeholder: 'Select tags...',
      closeAfterSelect: false,
      hideSelected: true
    });
  </script>
</body>
</html>
